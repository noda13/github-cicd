# GITHUB_OUTPUT環境変数によるデータの共有
name: GitHub Output
on: push
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - id: source  # ステップIDを指定
        run: echo "result=Hello" >> "${GITHUB_OUTPUT}"  # 結果をGITHUB_OUTPUT環境変数に出力
      - env:
          RESULT: ${{ steps.source.outputs.result }}  # stepコンテキストから参照
        run: echo "${RESULT}"

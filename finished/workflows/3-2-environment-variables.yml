# ジョブレベルで定義した環境変数の参照
name: Environment Variables
on: push
jobs:
  print:
    runs-on: ubuntu-latest
    env:
      BRANCH: main  # ジョブレベル環境変数の定義
    steps:
      - run: echo "${BRANCH}" # ジョブレベル環境変数の参照
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}  # envコンテキスト経由でジョブレベル環境変数の参照
